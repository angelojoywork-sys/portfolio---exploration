<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angelo's Creative World</title>
  <meta name="description" content="Portfolio of Angelo: visual design, UX, design engineering, motion, video and photography.">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400;500&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Shared drawing defs: hand-drawn wobble + the Angelo head. -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wobble2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Angelo's head, centred on 0,0 -->
    <g id="head">
      <ellipse class="s" cx="-33" cy="2" rx="6" ry="9"/>
      <ellipse class="s" cx="33" cy="2" rx="6" ry="9"/>
      <ellipse class="s" cx="0" cy="0" rx="33" ry="37"/>
      <path class="h" d="M-35 -6 C-42 -40 -10 -54 6 -45 C28 -52 42 -28 35 -4 C27 -24 12 -27 0 -24 C-12 -27 -27 -21 -35 -6Z"/>
      <path class="l" d="M-2 -46 C-8 -62 8 -66 12 -52"/>
      <path class="s" d="M3 -5 C17 -3 21 14 11 19 C2 21 -3 12 3 -5Z"/>
      <circle class="d" cx="-14" cy="-11" r="3.4"/>
      <circle class="d" cx="10" cy="-13" r="3.4"/>
      <path class="l" d="M-11 25 Q1 33 14 23"/>
    </g>

    <g id="torso">
      <path class="a" d="M80 100 C72 122 74 150 78 170 L122 170 C126 150 128 122 120 100 Z"/>
    </g>
    <g id="shoes">
      <path class="w" d="M72 214 C72 206 92 206 94 214 L94 224 L70 224Z"/>
      <path class="w" d="M108 214 C108 206 128 206 130 214 L130 224 L106 224Z"/>
    </g>

    <!-- 1. Visual Designer -->
    <g id="visual">
      <path class="l" d="M90 170 L84 214"/>
      <path class="l" d="M112 170 C120 190 130 200 142 206"/>
      <path class="w" d="M72 214 C72 206 92 206 94 214 L94 224 L70 224Z"/>
      <path class="w" d="M138 198 C146 194 160 202 156 212 L136 214Z"/>
      <path class="a" d="M18 168 c-8-8 4-18 12-10 c8-6 18 4 10 12 c8 8-4 16-12 10 c-8 4-18-4-10-12z"/>
      <circle class="a" cx="52" cy="192" r="4"/>
      <circle class="a" cx="12" cy="146" r="4"/>
      <use href="#torso"/>
      <path class="l" d="M80 108 C62 120 48 126 40 112"/>
      <circle class="s" cx="40" cy="110" r="7"/>
      <path class="l" d="M140 136 L180 30" stroke-width="7"/>
      <path class="l" d="M120 108 C138 112 150 102 156 90"/>
      <use href="#head" transform="translate(100 62) rotate(-6)"/>
      <circle class="s" cx="157" cy="88" r="7"/>
      <path class="a" d="M178 36 C166 16 190 4 198 20 C202 32 190 46 180 38Z"/>
    </g>

    <!-- 2. UX Designer -->
    <g id="ux">
      <path class="l" d="M92 170 L88 214"/>
      <path class="l" d="M110 170 L116 214"/>
      <use href="#shoes"/>
      <use href="#torso"/>
      <rect class="a" x="22" y="132" width="32" height="32" transform="rotate(-10 38 148)"/>
      <rect class="w" x="34" y="116" width="28" height="28" transform="rotate(8 48 130)"/>
      <path class="l" d="M40 126 L56 127 M40 134 L52 135" stroke-width="3"/>
      <path class="l" d="M80 108 C64 122 58 134 56 146"/>
      <circle class="s" cx="56" cy="148" r="7"/>
      <path class="l" d="M120 108 C136 116 146 112 152 100"/>
      <use href="#head" transform="translate(102 63) rotate(8)"/>
      <path class="l" d="M152 98 L164 80" stroke-width="6"/>
      <circle class="s" cx="152" cy="99" r="7"/>
      <circle class="w" cx="176" cy="60" r="24"/>
      <rect class="l" x="164" y="50" width="24" height="7" stroke-width="3"/>
      <rect class="l" x="164" y="62" width="10" height="14" stroke-width="3"/>
      <path class="l" d="M180 65 L188 65 M180 72 L188 72" stroke-width="3"/>
    </g>

    <!-- 3. Design Engineer -->
    <g id="engineer">
      <path class="l" d="M92 170 L86 214"/>
      <path class="l" d="M110 170 C118 186 114 200 126 206"/>
      <path class="w" d="M70 214 C70 206 90 206 92 214 L92 224 L68 224Z"/>
      <path class="w" d="M122 198 C130 196 142 204 138 212 L120 212Z"/>
      <use href="#torso"/>
      <path class="l" d="M90 152 L96 130" stroke-width="4"/>
      <circle class="w" cx="97" cy="127" r="5"/>
      <path class="w" d="M114 152 L186 152 L192 160 L108 160Z"/>
      <rect class="a" x="124" y="106" width="54" height="42" rx="4"/>
      <path class="l" d="M138 116 L130 126 L138 136 M168 116 L176 126 L168 136 M150 138 L156 114" stroke-width="3.5"/>
      <path class="l" d="M80 108 C90 130 102 148 120 156"/>
      <path class="l" d="M120 108 C130 126 132 142 128 154"/>
      <use href="#head" transform="translate(98 66) rotate(14)"/>
      <circle class="s" cx="121" cy="157" r="7"/>
      <circle class="s" cx="128" cy="155" r="7"/>
    </g>

    <!-- 4. Motion Designer -->
    <g id="motion">
      <path class="l" d="M92 170 L66 196 L50 184"/>
      <path class="l" d="M110 170 L142 190 L160 206"/>
      <path class="w" d="M42 186 C40 176 56 174 58 184 L52 192Z"/>
      <path class="w" d="M156 200 C166 198 174 208 168 214 L154 212Z"/>
      <use href="#torso"/>
      <path class="l" d="M80 106 C62 90 52 70 44 52"/>
      <path class="l" d="M120 106 C140 88 150 72 160 56"/>
      <circle class="s" cx="44" cy="50" r="7"/>
      <circle class="s" cx="160" cy="54" r="7"/>
      <use href="#head" transform="translate(100 62) rotate(-6)"/>
    </g>

    <!-- 5. Video Editor -->
    <g id="video">
      <path class="l" d="M92 170 L84 214"/>
      <path class="l" d="M110 170 C116 190 108 200 118 212"/>
      <use href="#shoes"/>
      <use href="#torso"/>
      <g transform="rotate(-24 127 118)">
        <rect class="w" x="116" y="118" width="22" height="90" rx="2"/>
        <path class="d" d="M119 126h4v5h-4zM119 140h4v5h-4zM119 154h4v5h-4zM119 168h4v5h-4zM119 182h4v5h-4zM119 196h4v5h-4zM131 126h4v5h-4zM131 140h4v5h-4zM131 154h4v5h-4zM131 168h4v5h-4zM131 182h4v5h-4zM131 196h4v5h-4z"/>
      </g>
      <path class="a" d="M76 100 C90 114 112 114 126 100 L130 116 C112 128 90 128 72 116Z"/>
      <path class="l" d="M120 110 C136 130 150 150 144 160"/>
      <path class="l" d="M80 108 C62 120 52 120 46 108"/>
      <circle class="s" cx="144" cy="160" r="7"/>
      <circle class="s" cx="46" cy="106" r="7"/>
      <path class="l" d="M44 104 L33 72 M48 104 L60 70"/>
      <circle class="w" cx="39" cy="118" r="5.5"/>
      <circle class="w" cx="53" cy="118" r="5.5"/>
      <g transform="translate(100 62) rotate(5)">
        <use href="#head"/>
        <path class="l" d="M-38 -4 C-46 -64 46 -64 38 -4" stroke-width="6"/>
        <rect class="a" x="-46" y="-14" width="15" height="30" rx="7"/>
        <rect class="a" x="31" y="-14" width="15" height="30" rx="7"/>
      </g>
    </g>

    <!-- 6. Photographer -->
    <g id="photo">
      <path class="l" d="M92 170 L74 196 L84 214"/>
      <path class="l" d="M110 170 L128 190 L132 214"/>
      <path class="w" d="M70 214 C70 206 92 206 94 214 L94 224 L68 224Z"/>
      <path class="w" d="M122 214 C122 206 142 206 144 214 L144 224 L120 224Z"/>
      <use href="#torso"/>
      <path class="l" d="M80 108 C80 96 100 90 112 82"/>
      <use href="#head" transform="translate(100 62) rotate(-4)"/>
      <path class="l" d="M102 74 C88 82 84 94 86 102"/>
      <path class="l" d="M120 108 C146 112 150 94 142 82"/>
      <rect class="a" x="100" y="38" width="48" height="36" rx="6"/>
      <rect class="w" x="110" y="31" width="14" height="9" rx="2"/>
      <circle class="w" cx="154" cy="56" r="12"/>
      <circle class="d" cx="154" cy="56" r="4"/>
      <circle class="s" cx="113" cy="80" r="7"/>
      <circle class="s" cx="142" cy="80" r="7"/>
    </g>
  </defs>
</svg>

<main>
  <section id="home" class="home">
    <h1>Welcome to Angelo's creative world</h1>
    <p class="choose">choose character <span class="arrow" aria-hidden="true">↓</span></p>

    <ul class="cast" role="list">
      <li style="--i:0;--accent:var(--yellow)">
        <button class="char" type="button" data-role="visual" aria-label="Visual Designer">
          <svg viewBox="-10 -8 220 250" aria-hidden="true">
            <g class="fillL" filter="url(#wobble2)" transform="translate(5 4)"><use href="#visual"/></g>
            <g class="inkL" filter="url(#wobble)"><use href="#visual"/></g>
            <g class="ex ex-splash" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"><path d="M24 128 l-6 -8 M34 124 l2 -10 M12 160 l-8 0"/></g>
          </svg>
          <span class="label">Visual Designer</span>
        </button>
      </li>
      <li style="--i:1;--accent:var(--green)">
        <button class="char" type="button" data-role="ux" aria-label="UX Designer">
          <svg viewBox="-10 -8 220 250" aria-hidden="true">
            <g class="fillL" filter="url(#wobble2)" transform="translate(5 4)"><use href="#ux"/></g>
            <g class="inkL" filter="url(#wobble)"><use href="#ux"/></g>
          </svg>
          <span class="label">UX Designer</span>
        </button>
      </li>
      <li style="--i:2;--accent:var(--blue)">
        <button class="char" type="button" data-role="engineer" aria-label="Design Engineer">
          <svg viewBox="-10 -8 220 250" aria-hidden="true">
            <g class="fillL" filter="url(#wobble2)" transform="translate(5 4)"><use href="#engineer"/></g>
            <g class="inkL" filter="url(#wobble)"><use href="#engineer"/></g>
            <g class="ex ex-code">
              <path d="M138 8 h52 a8 8 0 0 1 8 8 v14 a8 8 0 0 1 -8 8 h-30 l-12 10 l2 -10 h-12 a8 8 0 0 1 -8 -8 v-14 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
              <text x="164" y="31" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="17" fill="#1a1a1a">&lt;/&gt;</text>
            </g>
          </svg>
          <span class="label">Design Engineer</span>
        </button>
      </li>
      <li style="--i:3;--accent:var(--violet)">
        <button class="char" type="button" data-role="motion" aria-label="Motion Designer">
          <svg viewBox="-10 -8 220 250" aria-hidden="true">
            <ellipse cx="100" cy="232" rx="40" ry="6" fill="#1a1a1a" opacity=".12"/>
            <g class="ex ex-arc" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9"><path d="M26 226 C0 160 4 110 30 80"/><path d="M178 226 C204 170 200 130 184 108"/></g>
            <g class="char-body" transform="translate(0 -14)">
              <g class="fillL" filter="url(#wobble2)" transform="translate(5 4)"><use href="#motion"/></g>
              <g class="inkL" filter="url(#wobble)"><use href="#motion"/></g>
            </g>
            <g class="ex ex-play">
              <path d="M168 140 L168 190" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
              <path d="M168 144 L196 164 L168 184Z" fill="var(--accent)" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
            </g>
          </svg>
          <span class="label">Motion Designer</span>
        </button>
      </li>
      <li style="--i:4;--accent:var(--red)">
        <button class="char" type="button" data-role="video" aria-label="Video Editor">
          <svg viewBox="-10 -8 220 250" aria-hidden="true">
            <g class="fillL" filter="url(#wobble2)" transform="translate(5 4)"><use href="#video"/></g>
            <g class="inkL" filter="url(#wobble)"><use href="#video"/></g>
          </svg>
          <span class="label">Video Editor</span>
        </button>
      </li>
      <li style="--i:5;--accent:var(--orange)">
        <button class="char" type="button" data-role="photo" aria-label="Photographer">
          <svg viewBox="-10 -8 220 250" aria-hidden="true">
            <g class="fillL" filter="url(#wobble2)" transform="translate(5 4)"><use href="#photo"/></g>
            <g class="inkL" filter="url(#wobble)"><use href="#photo"/></g>
            <g class="ex ex-flash">
              <path d="M178 6 l5 13 l13 5 l-13 5 l-5 13 l-5 -13 l-13 -5 l13 -5z" fill="var(--accent)" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
            </g>
          </svg>
          <span class="label">Photographer</span>
        </button>
      </li>
    </ul>
  </section>

  <section id="detail" class="detail" hidden aria-labelledby="detail-title">
    <div class="stage" id="detail-stage"></div>
    <h2 id="detail-title" tabindex="-1"></h2>
    <p class="soon">work coming soon</p>
    <a class="back" href="#" id="back">← back to all characters</a>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
